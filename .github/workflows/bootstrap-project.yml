name: Bootstrap refactored project

on:
  push:
    branches:
      - refactor/clean-game-architecture

permissions:
  contents: write

jobs:
  restore-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/clean-game-architecture
          fetch-depth: 0

      - name: Restore full project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/project.part* | base64 --decode > /tmp/gibli-refactor.tar.gz
          tar -xzf /tmp/gibli-refactor.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify architecture build
        run: npm run check

      - name: Commit clean refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "refactor: establish clean game architecture"
            git push origin HEAD:refactor/clean-game-architecture
          fi
